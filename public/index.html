<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Chatbot</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101114;
      color: white;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .chat {
      width: 100%;
      max-width: 750px;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    h1 { text-align: center; font-size: 28px; }
    #messages { flex: 1; padding: 16px 0; }

    .message {
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user { background: #30313a; margin-left: 40px; }
    .bot { background: #202127; margin-right: 40px; }

    .input-area { display: flex; gap: 10px; }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #202127;
      color: white;
      font-size: 16px;
      min-width: 0;
    }

    button {
      padding: 14px 18px;
      border: 0;
      border-radius: 12px;
      background: #10a37f;
      color: white;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }
  </style>
</head>
<body>
  <main class="chat">
    <h1>My AI Chatbot</h1>
    <div id="messages">
      <div class="message bot">Hello! I'm your AI assistant. Ask me anything!</div>
    </div>

    <form id="chatForm" class="input-area">
      <input id="userInput" placeholder="Message your AI..." autocomplete="off" required>
      <button id="sendButton" type="submit">Send</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");
    const button = document.getElementById("sendButton");

    function addMessage(text, sender) {
      const div = document.createElement("div");
      div.className = "message " + sender;
      div.textContent = text;
      messages.appendChild(div);
      div.scrollIntoView({ behavior: "smooth", block: "end" });
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      button.disabled = true;
      const waiting = addMessage("Thinking...", "bot");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        waiting.textContent = data.reply;
      } catch (error) {
        waiting.textContent = "Sorry, something went wrong. Please check that the server is running.";
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
